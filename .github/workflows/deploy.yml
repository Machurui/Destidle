name: Deploy

on:
  push:
    branches:
      - main
    # Un push qui ne touche que la doc ou la licence ne relance pas de déploiement.
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: dotnet test backend/Destidle.sln

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit -- --run

  publish:
    name: Build and publish images
    needs: test
    # Images et production depuis main seulement (README « Sécurité du runner »).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Publications l'une après l'autre : latest suit l'ordre des commits.
    concurrency:
      group: destidle-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app image metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/destidle
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Generate importer image metadata
        id: meta-importer
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/destidle-importer
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish importer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Destidle.Importer/Dockerfile
          push: true
          tags: ${{ steps.meta-importer.outputs.tags }}
          labels: ${{ steps.meta-importer.outputs.labels }}
          cache-from: type=gha,scope=importer
          cache-to: type=gha,mode=max,scope=importer

  deploy:
    name: Restart Kubernetes deployment
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - deploy
    environment: production
    # Ni checkout ni appel à l'API GitHub : jeton sans aucun droit.
    permissions: {}

    env:
      # Kubeconfig dédié via la variable KUBECONFIG_PATH (README « Sécurité du runner »).
      KUBECONFIG: ${{ vars.KUBECONFIG_PATH || '/home/github-runner/.kube/config' }}
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      DEPLOYMENT: ${{ vars.DESTIDLE_DEPLOYMENT }}

    concurrency:
      group: destidle-production
      cancel-in-progress: false

    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NAMESPACE:-}" ]; then
            echo "::error::K8S_NAMESPACE est vide."
            exit 1
          fi

          if [ -z "${DEPLOYMENT:-}" ]; then
            echo "::error::DESTIDLE_DEPLOYMENT est vide."
            exit 1
          fi

          # Accès au seul déploiement visé : ni URL de l'API ni liste des namespaces dans ce journal public.
          kubectl -n "$NAMESPACE" get "deployment/$DEPLOYMENT" -o name

      - name: Restart deployment
        id: rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$NAMESPACE" rollout restart \
            "deployment/$DEPLOYMENT"

          kubectl -n "$NAMESPACE" rollout status \
            "deployment/$DEPLOYMENT" \
            --timeout=5m

      - name: Show pods and recent events
        # Diagnostic d'un redémarrage en échec, limité au namespace (aucune valeur secrète dans ces sorties).
        if: failure() && steps.rollout.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" get pods || true
          kubectl -n "$NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -n 20 || true
